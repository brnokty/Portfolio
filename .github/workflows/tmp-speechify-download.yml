name: Temp Speechify Capture
on:
  pull_request:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser audio capture deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pulseaudio ffmpeg xvfb
          python3 -m pip install --quiet selenium
      - name: Capture actual Speechify playback
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf speechify_capture && mkdir speechify_capture
          pulseaudio --start || true
          pactl load-module module-null-sink sink_name=SpeechSink sink_properties=device.description=SpeechSink || true
          pactl set-default-sink SpeechSink
          pactl set-default-source SpeechSink.monitor
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x960x24 >/tmp/xvfb.log 2>&1 &
          sleep 2
          cat > /tmp/capture.py <<'PY'
          import subprocess, time, pathlib, os
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          out=pathlib.Path('speechify_capture')
          urls={
            'wife1':'https://app.speechify.com/soundbite/7f9e7eac6126477eae9ebc3257ab8fc5?utm_source=chatgpt_app&utm_medium=punchout',
            'husband1':'https://app.speechify.com/soundbite/9d14f4ce44d2488eb7d61dbbd072a653?utm_source=chatgpt_app&utm_medium=punchout',
            'wife2':'https://app.speechify.com/soundbite/43e4e808801c44c381163fdb1af31e2a?utm_source=chatgpt_app&utm_medium=punchout',
            'husband2':'https://app.speechify.com/soundbite/18ac239e4897431f8cb8709385aacf27?utm_source=chatgpt_app&utm_medium=punchout',
          }
          opt=Options()
          opt.add_argument('--no-sandbox')
          opt.add_argument('--disable-dev-shm-usage')
          opt.add_argument('--autoplay-policy=no-user-gesture-required')
          opt.add_argument('--disable-gpu')
          opt.add_argument('--window-size=1280,960')
          opt.add_argument('--use-fake-ui-for-media-stream')
          opt.add_argument('--alsa-output-device=default')
          driver=webdriver.Chrome(options=opt)
          wait=WebDriverWait(driver,25)
          for name,url in urls.items():
              print('OPEN',name,url,flush=True)
              driver.get(url)
              time.sleep(7)
              # Make sure volume is unmuted if compact player is already open.
              try:
                  vol=driver.find_element(By.CSS_SELECTOR,"[data-testid='compact-player-volume-button']")
                  if (vol.get_attribute('aria-label') or '').lower()=='unmute':
                      driver.execute_script('arguments[0].click()',vol)
              except Exception as e: print('vol',e,flush=True)
              raw=out/f'{name}-raw.wav'
              ff=subprocess.Popen(['ffmpeg','-hide_banner','-loglevel','warning','-y','-f','pulse','-i','SpeechSink.monitor','-ac','2','-ar','48000','-t','9',str(raw)])
              time.sleep(.4)
              clicked=False
              selectors=["[data-testid='compact-player-listen-button']","[data-testid='player-play-button']"]
              for sel in selectors:
                  try:
                      btn=wait.until(EC.element_to_be_clickable((By.CSS_SELECTOR,sel)))
                      print('CLICK',sel,'label',btn.get_attribute('aria-label'),'text',btn.text,flush=True)
                      driver.execute_script('arguments[0].click()',btn)
                      clicked=True
                      break
                  except Exception as e: print('click fail',sel,e,flush=True)
              if not clicked:
                  raise RuntimeError(f'No listen/play button for {name}')
              ff.wait(timeout=15)
              # Trim leading/trailing silence, preserve a tiny natural boundary.
              trimmed=out/f'{name}.wav'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','warning','-y','-i',str(raw),'-af',
                  'silenceremove=start_periods=1:start_silence=0.08:start_threshold=-46dB:stop_periods=-1:stop_silence=0.12:stop_threshold=-46dB',
                  '-ar','48000','-ac','2',str(trimmed)],check=True)
              subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(trimmed)],check=False)
          driver.quit()
          PY
          python3 /tmp/capture.py
          rm -f speechify_capture/*-raw.wav
          ls -lh speechify_capture
          for f in speechify_capture/*.wav; do echo ===$f===; ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: speechify-captured-wav
          path: speechify_capture/*.wav
          if-no-files-found: error
