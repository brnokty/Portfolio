name: Temp Speechify Download
on:
  push:
    paths:
      - '.github/workflows/tmp-speechify-download.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Speechify soundbites
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf speechify_bridge_out
          mkdir -p speechify_bridge_out
          python3 - <<'PY'
          import requests, re, json, pathlib, html
          out=pathlib.Path('speechify_bridge_out')
          urls = {
            'wife1':'https://app.speechify.com/soundbite/7f9e7eac6126477eae9ebc3257ab8fc5?utm_source=chatgpt_app&utm_medium=punchout',
            'husband1':'https://app.speechify.com/soundbite/9d14f4ce44d2488eb7d61dbbd072a653?utm_source=chatgpt_app&utm_medium=punchout',
            'wife2':'https://app.speechify.com/soundbite/43e4e808801c44c381163fdb1af31e2a?utm_source=chatgpt_app&utm_medium=punchout',
            'husband2':'https://app.speechify.com/soundbite/18ac239e4897431f8cb8709385aacf27?utm_source=chatgpt_app&utm_medium=punchout',
          }
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'})
          report=[]
          for name,url in urls.items():
              info={'name':name,'source':url,'tries':[]}
              r=s.get(url,timeout=60,allow_redirects=True)
              info['top']={'status':r.status_code,'url':r.url,'ctype':r.headers.get('content-type'),'length':len(r.content)}
              ctype=(r.headers.get('content-type') or '').lower()
              if 'audio/' in ctype:
                  ext='.m4a' if 'mp4' in ctype else '.wav' if 'wav' in ctype else '.mp3'
                  (out/f'{name}{ext}').write_bytes(r.content)
                  info['saved']=f'{name}{ext}'
                  report.append(info); continue
              text=r.text
              (out/f'{name}.html').write_text(text,errors='ignore')
              text2=html.unescape(text).replace('\\u0026','&').replace('\\/','/')
              cand=[]
              patterns=[r'https?://[^"\'<>\\\s]+',r'["\'](?:src|url|audioUrl|audio_url|audioSrc|audio_src)["\']\s*:\s*["\']([^"\']+)',r'(?:src|url)=["\']([^"\']+)["\']']
              for pat in patterns:
                  for m in re.finditer(pat,text2,re.I):
                      u=m.group(1) if m.lastindex else m.group(0)
                      u=u.replace('&amp;','&')
                      if u.startswith('//'):u='https:'+u
                      if u.startswith('http') and u not in cand:cand.append(u)
              (out/f'{name}-urls.json').write_text(json.dumps(cand,indent=2))
              for i,u in enumerate(cand):
                  if not any(k in u.lower() for k in ['audio','mp3','m4a','wav','aac','cdn','media','soundbite','storage.googleapis']):continue
                  try:
                      rr=s.get(u,timeout=60,allow_redirects=True,headers={'Referer':r.url,'User-Agent':s.headers['User-Agent']})
                      ct=(rr.headers.get('content-type') or '').lower()
                      info['tries'].append({'i':i,'url':u,'final':rr.url,'status':rr.status_code,'ctype':ct,'length':len(rr.content)})
                      if 'audio/' in ct or rr.url.split('?')[0].lower().endswith(('.mp3','.m4a','.wav','.aac')):
                          ext='.m4a' if 'mp4' in ct else '.wav' if 'wav' in ct else '.aac' if 'aac' in ct else '.mp3'
                          (out/f'{name}{ext}').write_bytes(rr.content)
                          info['saved']=f'{name}{ext}'
                          break
                  except Exception as e:
                      info['tries'].append({'i':i,'url':u,'error':str(e)})
              report.append(info)
          (out/'report.json').write_text(json.dumps(report,indent=2))
          PY
          find speechify_bridge_out -maxdepth 1 -type f -printf '%f %s bytes\n'
      - name: Commit bridge results
        shell: bash
        run: |
          git config user.name 'speechify-bridge-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add speechify_bridge_out
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Temporary Speechify bridge results [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: speechify-audio
          path: speechify_bridge_out/
          if-no-files-found: error
