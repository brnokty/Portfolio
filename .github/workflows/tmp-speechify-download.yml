name: Temp Speechify Download
on:
  push:
    paths:
      - '.github/workflows/tmp-speechify-download.yml'
  workflow_dispatch:

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Speechify soundbites
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          python3 - <<'PY'
          import requests, re, json, pathlib
          urls = {
            'wife1':'https://app.speechify.com/soundbite/7f9e7eac6126477eae9ebc3257ab8fc5?utm_source=chatgpt_app&utm_medium=punchout',
            'husband1':'https://app.speechify.com/soundbite/9d14f4ce44d2488eb7d61dbbd072a653?utm_source=chatgpt_app&utm_medium=punchout',
            'wife2':'https://app.speechify.com/soundbite/43e4e808801c44c381163fdb1af31e2a?utm_source=chatgpt_app&utm_medium=punchout',
            'husband2':'https://app.speechify.com/soundbite/18ac239e4897431f8cb8709385aacf27?utm_source=chatgpt_app&utm_medium=punchout',
          }
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'})
          for name,url in urls.items():
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\nTOP',name,r.status_code,r.url,r.headers.get('content-type'),len(r.content))
              pathlib.Path(f'out/{name}.html').write_bytes(r.content)
              ctype=(r.headers.get('content-type') or '').lower()
              if 'audio/' in ctype:
                  pathlib.Path(f'out/{name}.mp3').write_bytes(r.content)
                  continue
              text=r.text
              # collect direct URLs, JSON escaped URLs, media src values
              text2=text.replace('\\u0026','&').replace('\\/','/')
              pats=[r'https?://[^"\'<>\\\s]+', r'(?:src|url|audioUrl|audio_url)["\']?\s*[:=]\s*["\']([^"\']+)']
              cand=[]
              for pat in pats:
                  for m in re.finditer(pat,text2,re.I):
                      u=m.group(1) if m.lastindex else m.group(0)
                      u=u.replace('&amp;','&')
                      if u.startswith('//'): u='https:'+u
                      if u.startswith('http') and u not in cand: cand.append(u)
              pathlib.Path(f'out/{name}-urls.json').write_text(json.dumps(cand,indent=2))
              for i,u in enumerate(cand):
                  if not any(k in u.lower() for k in ['audio','mp3','m4a','wav','cdn','media','soundbite']):
                      continue
                  try:
                      rr=s.get(u,timeout=60,allow_redirects=True,headers={'Referer':r.url,'User-Agent':'Mozilla/5.0'})
                      ct=(rr.headers.get('content-type') or '').lower()
                      print('TRY',i,rr.status_code,ct,len(rr.content),rr.url)
                      if 'audio/' in ct or rr.url.split('?')[0].lower().endswith(('.mp3','.m4a','.wav','.aac')):
                          ext='.m4a' if 'mp4' in ct else '.wav' if 'wav' in ct else '.mp3'
                          pathlib.Path(f'out/{name}{ext}').write_bytes(rr.content)
                          break
                  except Exception as e:
                      print('ERR',i,e)
          PY
          echo 'FILES:'
          find out -type f -maxdepth 1 -printf '%f %s\n'
      - uses: actions/upload-artifact@v4
        with:
          name: speechify-audio
          path: out/
          if-no-files-found: error
